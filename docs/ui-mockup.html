<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTPVault — UI redesign</title>
<style>
  :root {
    /* page chrome — theme aware */
    --page-bg: #0c1110;
    --page-fg: #e9f1ec;
    --page-muted: #8494;
    --studio: radial-gradient(120% 80% at 50% -10%, #14201b 0%, #0a0f0d 60%);
    /* the app's own dark palette (the product's hero look) */
    --bg: #0a0f0d;
    --surface: #111a16;
    --surface-2: #17211d;
    --border: #223029;
    --text: #e9f1ec;
    --muted: #7c8b83;
    --accent: #34d399;
    --accent-deep: #10b981;
    --warn: #f5b54a;
    --danger: #f0776f;
    --ring-track: #223029;
  }
  @media (prefers-color-scheme: light) {
    :root { --page-bg: #eef2f0; --page-fg: #10201a; --page-muted: #5c6b63;
      --studio: radial-gradient(120% 80% at 50% -10%, #ffffff 0%, #e8efeb 60%); }
  }
  :root[data-theme="dark"] { --page-bg: #0c1110; --page-fg: #e9f1ec; --page-muted: #8494;
    --studio: radial-gradient(120% 80% at 50% -10%, #14201b 0%, #0a0f0d 60%); }
  :root[data-theme="light"] { --page-bg: #eef2f0; --page-fg: #10201a; --page-muted: #5c6b63;
    --studio: radial-gradient(120% 80% at 50% -10%, #ffffff 0%, #e8efeb 60%); }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--page-fg);
    font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; }

  .wrap { min-height: 100vh; background: var(--studio); padding: 56px 24px 80px; }
  header.top { max-width: 1040px; margin: 0 auto 44px; text-align: center; }
  .lockmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.02em; font-size: 15px; color: var(--page-fg); }
  .lockmark .glyph { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px;
    background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #06120d; }
  header.top h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.03em; margin: 22px 0 8px; text-wrap: balance; }
  header.top p { color: var(--page-muted); max-width: 60ch; margin: 0 auto; line-height: 1.5; font-size: 15px; }

  .stage { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 32px; justify-content: center; align-items: flex-start; }
  figure.device { margin: 0; }
  figcaption { margin-top: 16px; text-align: center; color: var(--page-muted); font-size: 13px; }
  figcaption b { color: var(--page-fg); font-weight: 600; }
  figcaption .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid var(--page-muted); font-size: 11px; margin-right: 7px; }

  /* phone */
  .phone { width: 300px; border-radius: 40px; padding: 10px; background: #05080700; position: relative;
    box-shadow: 0 0 0 10px #1c2521, 0 0 0 11px #2a3630, 0 40px 80px -30px rgba(0,0,0,.8); }
  .screen { background: var(--bg); border-radius: 31px; overflow: hidden; height: 620px; display: flex; flex-direction: column; position: relative; }
  .statusbar { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; color: var(--text); font-size: 13px; font-weight: 600; }
  .statusbar .dots { display: flex; gap: 5px; align-items: center; opacity: .9; }
  .statusbar .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text); }
  .appbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 14px; }
  .appbar .title { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: var(--text); }
  .appbar .title .glyph { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #06120d; }
  .iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
  .body { flex: 1; overflow: hidden; padding: 4px 16px 16px; }

  svg { display: block; }
  .ico { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* code card */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 15px; display: flex; align-items: center; gap: 13px; margin-bottom: 11px; }
  .avatar { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; color: #06120d; }
  .card .meta { flex: 1; min-width: 0; }
  .card .issuer { font-weight: 600; font-size: 14px; color: var(--text); letter-spacing: -0.01em; }
  .card .acct { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .card .code { font-size: 27px; font-weight: 600; letter-spacing: 4px; color: var(--text); margin-top: 7px; }
  .ring { position: relative; width: 34px; height: 34px; flex: none; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 600; }

  .fab { position: absolute; right: 18px; bottom: 20px; height: 50px; padding: 0 20px 0 16px; border-radius: 16px;
    background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #06120d; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; box-shadow: 0 12px 28px -10px var(--accent-deep); }

  /* onboarding */
  .ob { padding: 18px 22px; display: flex; flex-direction: column; height: 100%; }
  .brand-lg { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; margin: 22px auto 0; background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #06120d; box-shadow: 0 16px 40px -14px var(--accent-deep); }
  .ob h2 { text-align: center; font-size: 23px; letter-spacing: -0.02em; margin: 20px 0 6px; color: var(--text); }
  .ob .sub { text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0 auto 22px; max-width: 30ch; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 3px; font-weight: 500; }
  .input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 13px 14px; color: var(--text); font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .input.dots { letter-spacing: 3px; }
  .helper { font-size: 11.5px; color: var(--muted); line-height: 1.45; margin: 2px 3px 0; }
  .btn { margin-top: auto; height: 52px; border-radius: 15px; background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #06120d; font-weight: 700; font-size: 16px; display: grid; place-items: center; letter-spacing: -0.01em; }
  .btn.block { width: 100%; }

  /* recovery */
  .rec { padding: 18px 20px; display: flex; flex-direction: column; height: 100%; }
  .eyebrow { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); padding: 5px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; margin-top: 8px; }
  .rec h2 { font-size: 22px; letter-spacing: -0.02em; margin: 16px 0 8px; color: var(--text); }
  .rec .sub { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin: 0 0 18px; }
  .keycard { background: var(--surface); border: 1px dashed color-mix(in srgb, var(--warn) 45%, var(--border)); border-radius: 16px; padding: 16px; }
  .keycard .k { font-size: 15px; letter-spacing: 2px; line-height: 1.9; color: var(--text); word-spacing: 2px; }
  .keycard .copy { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 13px; border-top: 1px solid var(--border); padding-top: 12px; }
  .check { display: flex; align-items: center; gap: 11px; margin: 18px 2px 0; color: var(--text); font-size: 13.5px; }
  .box { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #06120d; flex: none; }

  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  }
</style>

<div class="wrap">
  <header class="top">
    <span class="lockmark"><span class="glyph"><svg width="15" height="15" viewBox="0 0 24 24" class="ico"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span> OTPVault</span>
    <h1>A calmer place for your codes</h1>
    <p>Redesign direction: <b style="color:var(--page-fg)">quiet vault</b> — dark and contained, one confident emerald accent, and the time-based countdown as the single living element. Codes are set in tabular monospace, like the precision instrument they are.</p>
  </header>

  <div class="stage">

    <!-- 1: HOME -->
    <figure class="device">
      <div class="phone"><div class="screen">
        <div class="statusbar"><span>9:41</span><span class="dots"><svg width="16" height="11" viewBox="0 0 18 12" class="ico" style="stroke:none;fill:currentColor"><rect x="0" y="3" width="3" height="6" rx="1"/><rect x="4.5" y="1.5" width="3" height="9" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1" opacity=".4"/></svg><span></span><span></span></span></div>
        <div class="appbar">
          <div class="title"><span class="glyph"><svg width="14" height="14" viewBox="0 0 24 24" class="ico"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span> OTPVault</div>
          <div class="iconbtn"><svg width="20" height="20" viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
        </div>
        <div class="body">
          <!-- card -->
          <div class="card">
            <div class="avatar" style="background:#e2e8f0">Gh</div>
            <div class="meta"><div class="issuer">GitHub</div><div class="acct">winklemad</div><div class="code mono">482915</div></div>
            <div class="ring"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--ring-track)" stroke-width="3"/><circle cx="17" cy="17" r="14" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="20" transform="rotate(-90 17 17)"/></svg><span class="num mono" style="color:var(--accent)">22</span></div>
          </div>
          <div class="card">
            <div class="avatar" style="background:#f6a04a">Cf</div>
            <div class="meta"><div class="issuer">Cloudflare</div><div class="acct">admin@nuivio.com</div><div class="code mono">703226</div></div>
            <div class="ring"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--ring-track)" stroke-width="3"/><circle cx="17" cy="17" r="14" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="44" transform="rotate(-90 17 17)"/></svg><span class="num mono" style="color:var(--accent)">15</span></div>
          </div>
          <div class="card">
            <div class="avatar" style="background:#facc4a">Aw</div>
            <div class="meta"><div class="issuer">AWS</div><div class="acct">root</div><div class="code mono" style="color:var(--danger)">159034</div></div>
            <div class="ring"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--ring-track)" stroke-width="3"/><circle cx="17" cy="17" r="14" fill="none" stroke="var(--danger)" stroke-width="3" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="76" transform="rotate(-90 17 17)"/></svg><span class="num mono" style="color:var(--danger)">4</span></div>
          </div>
          <div class="card">
            <div class="avatar" style="background:#8b9cf7">St</div>
            <div class="meta"><div class="issuer">Stripe</div><div class="acct">acct_1P4xQ…</div><div class="code mono">640288</div></div>
            <div class="ring"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--ring-track)" stroke-width="3"/><circle cx="17" cy="17" r="14" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="30" transform="rotate(-90 17 17)"/></svg><span class="num mono" style="color:var(--accent)">19</span></div>
          </div>
          <div class="fab"><svg width="20" height="20" viewBox="0 0 24 24" class="ico" style="stroke:#06120d"><path d="M12 5v14M5 12h14"/></svg> Add</div>
        </div>
      </div></div>
      <figcaption><span class="n">1</span><b>Home</b> — live codes &amp; countdown</figcaption>
    </figure>

    <!-- 2: ONBOARDING -->
    <figure class="device">
      <div class="phone"><div class="screen">
        <div class="statusbar"><span>9:41</span><span class="dots"><svg width="16" height="11" viewBox="0 0 18 12" class="ico" style="stroke:none;fill:currentColor"><rect x="0" y="3" width="3" height="6" rx="1"/><rect x="4.5" y="1.5" width="3" height="9" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1" opacity=".4"/></svg><span></span><span></span></span></div>
        <div class="ob">
          <div class="brand-lg"><svg width="30" height="30" viewBox="0 0 24 24" class="ico"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="#06120d" stroke="none"/></svg></div>
          <h2>Create your vault</h2>
          <p class="sub">Your codes, encrypted end-to-end and synced across every device you own.</p>
          <div class="field"><label>Handle</label><div class="input">you@example.com</div></div>
          <div class="field"><label>Master password</label><div class="input dots">••••••••••••</div></div>
          <p class="helper">Encrypts your vault on this device. It's never sent to our servers, and it can't be reset without your recovery key.</p>
          <div class="btn block">Continue</div>
        </div>
      </div></div>
      <figcaption><span class="n">2</span><b>Create account</b></figcaption>
    </figure>

    <!-- 3: RECOVERY -->
    <figure class="device">
      <div class="phone"><div class="screen">
        <div class="statusbar"><span>9:41</span><span class="dots"><svg width="16" height="11" viewBox="0 0 18 12" class="ico" style="stroke:none;fill:currentColor"><rect x="0" y="3" width="3" height="6" rx="1"/><rect x="4.5" y="1.5" width="3" height="9" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1" opacity=".4"/></svg><span></span><span></span></span></div>
        <div class="rec">
          <span class="eyebrow pulse"><svg width="12" height="12" viewBox="0 0 24 24" class="ico" style="stroke:var(--warn)"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> IMPORTANT — SAVE THIS</span>
          <h2>Your recovery key</h2>
          <p class="sub">The only way back in if you forget your password or lose every device. Store it in a password manager or on paper — we can't recover it for you.</p>
          <div class="keycard">
            <div class="k mono">K7F2&nbsp;9QXM&nbsp;4ABT&nbsp;RW83<br>LP6N&nbsp;D2VH&nbsp;8JKC&nbsp;EY5S</div>
            <div class="copy"><svg width="15" height="15" viewBox="0 0 24 24" class="ico" style="stroke:var(--accent)"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copy recovery key</div>
          </div>
          <div class="check"><span class="box"><svg width="14" height="14" viewBox="0 0 24 24" class="ico" style="stroke:#06120d;stroke-width:3"><path d="m5 12 5 5 9-11"/></svg></span> I've saved my recovery key somewhere safe</div>
          <div class="btn block" style="margin-top:22px">Create account</div>
        </div>
      </div></div>
      <figcaption><span class="n">3</span><b>Recovery key</b> — the critical step</figcaption>
    </figure>

  </div>
</div>

</body></html>
